# ============================================
# 数据字典
# 用户根据实际数据源维护此文件
# 字段的 description 用于 embedding 匹配
# ============================================
tables:
  - name: stock_base
    description: 个股日线基础行情
    fields:
      - name: STOCK_CODE
        description: 股票代码
      - name: TRADE_DATE
        description: 交易日 YYYYMMDD
      - name: CLOSE
        description: 收盘价
      - name: VOL
        description: 成交量（股）
      - name: AMOUNT
        description: 成交金额（元）
      - name: TURN
        description: 换手率
      - name: MV
        description: 总市值
      - name: PE_TTM
        description: 滚动市盈率
      - name: PB
        description: 市净率
      - name: INFLOW_RATE
        description: 资金流入率
      - name: BORROW_BUY
        description: 融资买入额
      - name: BORROW_REPAY
        description: 融资偿还额
      - name: ROE_TTM
        description: 净资产收益率
      - name: NET_ASSET_VALUE
        description: 净资产
      - name: VAL_MV
        description: 流通市值
      - name: RATING_GRADE
        description: 分析师评级（1=上调 0=持平 -1=下调）
      - name: industry_code
        description: 所属行业代码
      - name: industry
        description: 所属行业名称

  - name: swi_daily
    description: 申万行业指数日线行情
    fields:
      - name: STOCK_CODE
        description: 行业代码
      - name: TRADE_DATE
        description: 交易日 YYYYMMDD
      - name: CLOSE
        description: 行业指数收盘价
      - name: OPEN
        description: 行业指数开盘价
      - name: industry
        description: 行业名称

  - name: etf_daily
    description: ETF每日资金流数据
    fields:
      - name: S_INFO_WINDCODE
        description: Wind代码
      - name: TRADE_DT
        description: 交易日 YYYYMMDD
      - name: INDUSTRY
        description: 行业名称
      - name: INDUSTRY_CODE
        description: 行业代码
      - name: 净流入金额（万元）
        description: ETF净流入金额（万元人民币）

  - name: factor_stock
    description: 已计算的个股因子值
    fields:
      - name: STOCK_CODE
        description: 股票代码
      - name: TRADE_DATE
        description: 交易日 YYYYMMDD
      - name: up_stock
        description: 当日是否上涨
      - name: strong_stock
        description: 收盘价是否大于60日均线
      - name: strong_volume
        description: 成交量是否异常放大
      - name: ma8_pos
        description: 均线位置评分
      - name: tech_sync
        description: 技术指标是否同步
      - name: break_cons
        description: 是否突破整理平台
      - name: ma_bull
        description: 多头均线排列
      - name: ma_bear
        description: 空头均线排列
      - name: industry_code
        description: 所属行业代码

  - name: industry_daily
    description: 已计算的行业日度因子
    fields:
      - name: industry_code
        description: 行业代码
      - name: TRADE_DATE
        description: 交易日 YYYYMMDD
      - name: up_ratio
        description: 行业内上涨股票占比
      - name: strong_ratio
        description: 行业内强势股占比
      - name: vol_ratio
        description: 行业内放量股占比
      - name: ma_bull
        description: 行业多排占比
      - name: ma_bear
        description: 行业空排占比
      - name: mom_12m
        description: 行业12月动量

  - name: industry_monthly
    description: 已计算的行业月度因子
    fields:
      - name: industry_code
        description: 行业代码
      - name: ym
        description: 年月 YYYYMM
      - name: ret_T1
        description: 次月收益率
      - name: roe_pctl
        description: ROE景气度分位数
      - name: mom_12m_m
        description: 月度12月动量
