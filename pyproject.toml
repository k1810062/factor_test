[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-workbench"
version = "0.1.0"
description = "量化因子研究工作台：因子测试、评价与可视化"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "duckdb",
    "scipy",
    "matplotlib",
    "plotly",
    "streamlit",
    "streamlit-code-editor",
]

[tool.setuptools.packages.find]
where = ["src"]
